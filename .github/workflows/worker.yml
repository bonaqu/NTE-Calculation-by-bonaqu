name: Deploy Cloudflare Worker

on:
  push:
    branches: [bonaqu_projects]
    paths:
      - 'workers/**'
      - 'packages/**'
      - 'src/data.ts'
      - 'src/arc-directory.ts'
      - 'package.json'
      - '.github/workflows/worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-worker-production
  cancel-in-progress: true

jobs:
  deploy:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      deployment_url: ${{ steps.deploy.outputs.deployment-url }}
      health_url: ${{ steps.verify.outputs.health_url }}
      arcs_url: ${{ steps.verify.outputs.arcs_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Dry-run bundle
        run: npm run worker:check
      - name: Deploy nte-calculation-api
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          wranglerVersion: '4.114.0'
          command: deploy --config workers/api/wrangler.jsonc
      - name: Verify API health and Arc catalog
        id: verify
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          test -n "$DEPLOYMENT_URL"
          HEALTH_URL="${DEPLOYMENT_URL%/}/api/v1/health"
          ARCS_URL="${DEPLOYMENT_URL%/}/api/v1/data/arcs"
          curl --fail --location --retry 8 --retry-delay 5 --retry-all-errors "$HEALTH_URL" | tee /tmp/health.json
          curl --fail --location --retry 8 --retry-delay 5 --retry-all-errors "$ARCS_URL" | tee /tmp/arcs.json > /dev/null
          node <<'NODE'
          const fs = require('node:fs');
          const health = JSON.parse(fs.readFileSync('/tmp/health.json', 'utf8'));
          const catalog = JSON.parse(fs.readFileSync('/tmp/arcs.json', 'utf8'));
          const healthValid = health.ok === true
            && health.service === 'nte-calculation-api'
            && typeof health.version === 'string'
            && health.version.length > 0
            && typeof health.formulaVersion === 'string'
            && health.formulaVersion.length > 0;
          const catalogValid = catalog.count === 47
            && Array.isArray(catalog.data)
            && catalog.data.length === 47
            && catalog.sourceId === 'prydwen-arcs'
            && typeof catalog.verifiedAt === 'string';
          if (!healthValid || !catalogValid) {
            console.error('Unexpected production API contract:', { health, catalogCount: catalog.count, dataLength: catalog.data?.length, sourceId: catalog.sourceId });
            process.exit(1);
          }
          NODE
          echo "health_url=$HEALTH_URL" >> "$GITHUB_OUTPUT"
          echo "arcs_url=$ARCS_URL" >> "$GITHUB_OUTPUT"
          echo "Cloudflare Worker is healthy: $HEALTH_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Arc catalog verified with 47 entries: $ARCS_URL" >> "$GITHUB_STEP_SUMMARY"

  report:
    if: ${{ always() }}
    permissions:
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: deploy
    steps:
      - name: Publish deployment evidence
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_RESULT: ${{ needs.deploy.result }}
          DEPLOYMENT_URL: ${{ needs.deploy.outputs.deployment_url }}
          HEALTH_URL: ${{ needs.deploy.outputs.health_url }}
          ARCS_URL: ${{ needs.deploy.outputs.arcs_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ "$JOB_RESULT" == "success" && -n "$HEALTH_URL" && -n "$ARCS_URL" ]]; then
            BODY="### Cloudflare Worker deployment: successful ✅

          - Worker URL: $DEPLOYMENT_URL
          - Health endpoint: $HEALTH_URL
          - Full Arc catalog: $ARCS_URL
          - Deploy, health and 47-entry catalog validation: success
          - Workflow evidence: $RUN_URL"
          elif [[ -n "$DEPLOYMENT_URL" ]]; then
            BODY="### Cloudflare Worker production verification: requires attention ❌

          - Worker deployment completed: $DEPLOYMENT_URL
          - Deployment job result: $JOB_RESULT
          - Health or data-contract validation did not pass
          - Workflow diagnostics: $RUN_URL"
          else
            BODY="### Cloudflare Worker deployment: requires attention ❌

          - Deployment job result: $JOB_RESULT
          - No deployment URL was produced
          - Workflow diagnostics: $RUN_URL"
          fi
          gh issue comment 5 --repo "$GITHUB_REPOSITORY" --body "$BODY"
