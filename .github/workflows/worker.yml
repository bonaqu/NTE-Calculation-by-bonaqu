name: Deploy Cloudflare Worker

on:
  push:
    branches: [bonaqu_projects]
    paths:
      - 'workers/**'
      - 'packages/**'
      - 'src/data.ts'
      - 'package.json'
      - '.github/workflows/worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-worker-production
  cancel-in-progress: true

jobs:
  deploy:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      deployment_url: ${{ steps.deploy.outputs.deployment-url }}
      health_url: ${{ steps.verify.outputs.health_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Dry-run bundle
        run: npm run worker:check
      - name: Deploy nte-calculation-api
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          wranglerVersion: '4.114.0'
          command: deploy --config workers/api/wrangler.jsonc
      - name: Verify API health
        id: verify
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          test -n "$DEPLOYMENT_URL"
          HEALTH_URL="${DEPLOYMENT_URL%/}/api/v1/health"
          curl --fail --location --retry 8 --retry-delay 5 --retry-all-errors "$HEALTH_URL" | tee /tmp/health.json
          node <<'NODE'
          const fs = require('node:fs');
          const body = JSON.parse(fs.readFileSync('/tmp/health.json', 'utf8'));
          const valid = body.ok === true
            && body.service === 'nte-calculation-api'
            && typeof body.version === 'string'
            && body.version.length > 0
            && typeof body.formulaVersion === 'string'
            && body.formulaVersion.length > 0;
          if (!valid) {
            console.error('Unexpected health response contract:', body);
            process.exit(1);
          }
          NODE
          echo "health_url=$HEALTH_URL" >> "$GITHUB_OUTPUT"
          echo "Cloudflare Worker is healthy: $HEALTH_URL" >> "$GITHUB_STEP_SUMMARY"

  report:
    if: ${{ always() }}
    permissions:
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: deploy
    steps:
      - name: Publish deployment evidence
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_RESULT: ${{ needs.deploy.result }}
          DEPLOYMENT_URL: ${{ needs.deploy.outputs.deployment_url }}
          HEALTH_URL: ${{ needs.deploy.outputs.health_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ "$JOB_RESULT" == "success" && -n "$HEALTH_URL" ]]; then
            BODY="### Cloudflare Worker deployment: successful ✅

          - Worker URL: $DEPLOYMENT_URL
          - Health endpoint: $HEALTH_URL
          - Deploy and JSON health validation: success
          - Workflow evidence: $RUN_URL"
          elif [[ -n "$DEPLOYMENT_URL" ]]; then
            BODY="### Cloudflare Worker health verification: requires attention ❌

          - Worker deployment completed: $DEPLOYMENT_URL
          - Deployment job result: $JOB_RESULT
          - Health contract or reachability check did not pass
          - Workflow diagnostics: $RUN_URL"
          else
            BODY="### Cloudflare Worker deployment: requires attention ❌

          - Deployment job result: $JOB_RESULT
          - No deployment URL was produced
          - Workflow diagnostics: $RUN_URL"
          fi
          gh issue comment 5 --repo "$GITHUB_REPOSITORY" --body "$BODY"
