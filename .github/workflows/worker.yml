name: Deploy Cloudflare Worker

on:
  push:
    branches: [bonaqu_projects]
    paths:
      - 'workers/**'
      - 'packages/**'
      - 'src/data.ts'
      - 'src/characters.ts'
      - 'src/types.ts'
      - 'src/arc-directory.ts'
      - 'src/arc-catalog.ts'
      - 'src/arc-presets.ts'
      - 'src/esper-cycles.ts'
      - 'src/rotation-presets.ts'
      - 'src/progression-data.ts'
      - 'src/progression-engine.ts'
      - 'package.json'
      - '.github/workflows/worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-worker-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      deployment_url: ${{ steps.deploy.outputs.deployment-url }}
      health_url: ${{ steps.verify.outputs.health_url }}
      arcs_url: ${{ steps.verify.outputs.arcs_url }}
      presets_url: ${{ steps.verify.outputs.presets_url }}
      characters_url: ${{ steps.verify.outputs.characters_url }}
      cycles_url: ${{ steps.verify.outputs.cycles_url }}
      rotations_url: ${{ steps.verify.outputs.rotations_url }}
      progression_url: ${{ steps.verify.outputs.progression_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Quality gate
        run: |
          npm run typecheck
          npm test
          npm run worker:check
      - name: Deploy nte-calculation-api
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          wranglerVersion: '4.114.0'
          command: deploy --config workers/api/wrangler.jsonc
      - name: Verify production contract
        id: verify
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          EXPECTED_SERVICE_VERSION: '0.6.1'
          EXPECTED_FORMULA_VERSION: '0.2'
        run: |
          BASE="${DEPLOYMENT_URL%/}"
          test -n "$BASE"
          HEALTH_URL="$BASE/api/v1/health"
          ARCS_URL="$BASE/api/v1/data/arcs"
          PRESETS_URL="$BASE/api/v1/data/arc-presets"
          CHARACTERS_URL="$BASE/api/v1/data/characters"
          CYCLES_URL="$BASE/api/v1/data/esper-cycles"
          ROTATIONS_URL="$BASE/api/v1/data/rotation-presets"
          PROGRESSION_URL="$BASE/api/v1/data/progression/characters"

          for attempt in $(seq 1 30); do
            echo "Production contract check $attempt/30"
            curl -fsSL "$HEALTH_URL" -o /tmp/health.json || true
            curl -fsSL "$ARCS_URL" -o /tmp/arcs.json || true
            curl -fsSL "$PRESETS_URL" -o /tmp/presets.json || true
            curl -fsSL "$CHARACTERS_URL" -o /tmp/characters.json || true
            curl -fsSL "$CYCLES_URL" -o /tmp/cycles.json || true
            curl -fsSL "$ROTATIONS_URL" -o /tmp/rotations.json || true
            curl -fsSL "$PROGRESSION_URL" -o /tmp/progression.json || true

            if node <<'NODE'
          const fs = require('node:fs');
          const read = (path) => JSON.parse(fs.readFileSync(path, 'utf8'));
          try {
            const health = read('/tmp/health.json');
            const arcs = read('/tmp/arcs.json');
            const presets = read('/tmp/presets.json');
            const characters = read('/tmp/characters.json');
            const cycles = read('/tmp/cycles.json');
            const rotations = read('/tmp/rotations.json');
            const progression = read('/tmp/progression.json');
            const wrongM1 = presets.data.find((item) => item.id === 'wrong-gate-m1');
            const wrongM5 = presets.data.find((item) => item.id === 'wrong-gate-m5');
            const shinku = rotations.data.find((item) => item.id === 'shinku-charge');
            const hathor = rotations.data.find((item) => item.id === 'hathor-hyper');
            const stepTotals = progression.steps.reduce((sum, step) => ({
              coins: sum.coins + step.beetleCoin,
              boss: sum.boss + step.bossCount,
              common: sum.common + step.commonCount,
            }), { coins: 0, boss: 0, common: 0 });
            const profile = (name) => progression.data.find((item) => item.characterName === name);
            const expectedDates = {
              Adler: '2026-07-28', Aurelia: '2026-07-28', Baicang: '2026-07-28', Chaos: '2026-07-28',
              Chiz: '2026-06-11', Daffodill: '2026-07-28', Edgar: '2026-07-28', Fadia: '2026-07-28',
              Haniel: '2026-07-28', Hathor: '2026-06-27', Hotori: '2026-07-01', Iroi: '2026-07-27',
              Jiuyuan: '2026-07-28', Lacrimosa: '2026-07-28', Mint: '2026-07-28', Nanally: '2026-07-31',
              Sakiri: '2026-07-28', Shinku: '2026-07-31', Skia: '2026-07-28', Zero: '2026-07-28',
            };
            const sourceDatesValid = progression.data.length === Object.keys(expectedDates).length
              && progression.data.every((item) => item.sourceUpdatedAt === expectedDates[item.characterName]);
            const valid = health.ok === true
              && health.version === process.env.EXPECTED_SERVICE_VERSION
              && health.formulaVersion === process.env.EXPECTED_FORMULA_VERSION
              && arcs.count === 47
              && arcs.sourceIds.includes('prydwen-arcs')
              && arcs.sourceIds.includes('gamewith-wrong-gate')
              && presets.count === 8
              && wrongM1.model.static.atkPct === 16
              && wrongM5.model.conditional.allyDmgBonus === 30
              && characters.count === 22
              && characters.releasedCount === 20
              && characters.upcomingCount === 2
              && cycles.count === 8
              && cycles.pairCount === 6
              && cycles.tripleCount === 2
              && rotations.count === 2
              && rotations.stepCount === 19
              && shinku.steps.length === 8
              && hathor.steps.length === 11
              && progression.count === 20
              && progression.stepCount === 6
              && progression.materialCount === 20
              && progression.bossMaterialCount === 7
              && progression.scope === 'released-character-ascension-only'
              && progression.verifiedAt === '2026-08-04'
              && progression.data.every((item) => item.commonMaterials.length === 3 && item.sourceUrl.startsWith('https://www.icy-veins.com/'))
              && sourceDatesValid
              && progression.sources.find((source) => source.publisher === 'Icy Veins')?.updatedAt === '2026-07-27'
              && !progression.data.some((item) => item.characterName === 'Linko' || item.characterName === 'Zankou')
              && profile('Iroi').bossMaterial === 'pageDelusionsShore'
              && profile('Shinku').bossMaterial === 'chargingKnightSparkPlug'
              && profile('Chaos').bossMaterial === 'tearOfTheSea'
              && profile('Hotori').bossMaterial === 'confessionalFlowerSeed'
              && profile('Lacrimosa').bossMaterial === 'confessionalFlowerSeed'
              && stepTotals.coins === 525000
              && stepTotals.boss === 86
              && stepTotals.common === 50
              && progression.exclusions.includes('character-exp')
              && progression.exclusions.includes('skills');
            process.exit(valid ? 0 : 1);
          } catch {
            process.exit(1);
          }
          NODE
            then
              echo "Production contract passed."
              break
            fi
            if [[ "$attempt" == "30" ]]; then
              echo "Expected Worker contract did not propagate within 150 seconds." >&2
              exit 1
            fi
            sleep 5
          done

          echo "health_url=$HEALTH_URL" >> "$GITHUB_OUTPUT"
          echo "arcs_url=$ARCS_URL" >> "$GITHUB_OUTPUT"
          echo "presets_url=$PRESETS_URL" >> "$GITHUB_OUTPUT"
          echo "characters_url=$CHARACTERS_URL" >> "$GITHUB_OUTPUT"
          echo "cycles_url=$CYCLES_URL" >> "$GITHUB_OUTPUT"
          echo "rotations_url=$ROTATIONS_URL" >> "$GITHUB_OUTPUT"
          echo "progression_url=$PROGRESSION_URL" >> "$GITHUB_OUTPUT"
          echo "API 0.6.1 verified: all 20 progression source dates match the current direct-source fixture." >> "$GITHUB_STEP_SUMMARY"

  report:
    if: ${{ always() }}
    permissions:
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: deploy
    steps:
      - name: Publish deployment evidence
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_RESULT: ${{ needs.deploy.result }}
          DEPLOYMENT_URL: ${{ needs.deploy.outputs.deployment_url }}
          HEALTH_URL: ${{ needs.deploy.outputs.health_url }}
          PROGRESSION_URL: ${{ needs.deploy.outputs.progression_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ "$JOB_RESULT" == "success" && -n "$HEALTH_URL" && -n "$PROGRESSION_URL" ]]; then
            BODY="### Cloudflare Worker deployment: successful ✅

          - Worker URL: $DEPLOYMENT_URL
          - Health endpoint: $HEALTH_URL
          - Roster ascension dataset: $PROGRESSION_URL
          - API 0.6.1 and exact 20-profile source-date freshness contract: success
          - Workflow evidence: $RUN_URL"
          else
            BODY="### Cloudflare Worker deployment: requires attention ❌

          - Deployment job result: $JOB_RESULT
          - Workflow diagnostics: $RUN_URL"
          fi
          gh issue comment 5 --repo "$GITHUB_REPOSITORY" --body "$BODY"
