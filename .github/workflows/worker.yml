name: Deploy Cloudflare Worker

on:
  push:
    branches: [bonaqu_projects]
    paths:
      - 'workers/**'
      - 'packages/**'
      - 'scripts/verify-worker-production.mjs'
      - 'scripts/verify-combat-scenario-production.mjs'
      - 'src/data.ts'
      - 'src/characters.ts'
      - 'src/types.ts'
      - 'src/arc-directory.ts'
      - 'src/arc-catalog.ts'
      - 'src/arc-presets.ts'
      - 'src/esper-cycles.ts'
      - 'src/rotation-presets.ts'
      - 'src/rotation-presets-base.ts'
      - 'src/rotation-presets-extra.ts'
      - 'src/game-visible-build.ts'
      - 'src/game-visible-calculation.ts'
      - 'src/verified-visible-actions.ts'
      - 'src/verified-visible-actions-*.ts'
      - 'src/team-effects.ts'
      - 'src/combat-scenario.ts'
      - 'src/progression-data.ts'
      - 'src/progression-engine.ts'
      - 'package.json'
      - '.github/workflows/worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-worker-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      deployment_url: ${{ steps.deploy.outputs.deployment-url }}
      health_url: ${{ steps.verify.outputs.health_url }}
      combat_models_url: ${{ steps.verify.outputs.combat_models_url }}
      combat_scenario_url: ${{ steps.verify.outputs.combat_scenario_url }}
      progression_url: ${{ steps.verify.outputs.progression_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Quality gate
        run: |
          npm run typecheck
          npm test
          npm run worker:check
      - name: Deploy nte-calculation-api
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          wranglerVersion: '4.114.0'
          command: deploy --config workers/api/wrangler.jsonc
      - name: Verify production contract
        id: verify
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          EXPECTED_SERVICE_VERSION: '0.9.0'
          EXPECTED_FORMULA_VERSION: '0.2'
          EXPECTED_VISIBLE_BUILD_VERSION: '1'
          EXPECTED_COMBAT_SCENARIO_VERSION: '1'
          EXPECTED_VERIFIED_ACTION_COUNT: '14'
          EXPECTED_VERIFIED_TEAM_EFFECT_COUNT: '4'
          EXPECTED_PARTIAL_CHARACTERS: 'Chaos,Hathor,Jiuyuan,Lacrimosa,Nanally,Shinku,Zero'
        run: |
          node scripts/verify-worker-production.mjs
          node scripts/verify-combat-scenario-production.mjs
          BASE="${DEPLOYMENT_URL%/}"
          echo "health_url=$BASE/api/v1/health" >> "$GITHUB_OUTPUT"
          echo "combat_models_url=$BASE/api/v1/data/combat-models" >> "$GITHUB_OUTPUT"
          echo "combat_scenario_url=$BASE/api/v1/calculate/combat-scenario" >> "$GITHUB_OUTPUT"
          echo "progression_url=$BASE/api/v1/data/progression/characters" >> "$GITHUB_OUTPUT"
          {
            echo '### API 0.9.0 production contract'
            echo
            echo '- 20 released-character coverage records'
            echo '- 14 verified standalone actions across 7 partial models'
            echo '- 4 verified conditional team effects'
            echo '- versioned combat-scenario endpoint with action/effect/wait steps'
            echo '- Shinku final ATK remains 2026; Arc ATK 570 is not added again'
            echo '- Hathor third Cyclone Strike 1099.4% and Jiuyuan A6 200% POST checks passed'
            echo '- Haniel +40 all-slot ATK and Sakiri +180 excluding self POST checks passed'
            echo '- Sakiri A4 applies at 19.9s and expires exactly at 20s'
            echo '- Hathor Remora raises expected CRIT from 50% to 60% through 11.9s and expires at 12s'
          } >> "$GITHUB_STEP_SUMMARY"

  report:
    if: ${{ always() }}
    permissions:
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: deploy
    steps:
      - name: Publish deployment evidence
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_RESULT: ${{ needs.deploy.result }}
          DEPLOYMENT_URL: ${{ needs.deploy.outputs.deployment_url }}
          HEALTH_URL: ${{ needs.deploy.outputs.health_url }}
          COMBAT_MODELS_URL: ${{ needs.deploy.outputs.combat_models_url }}
          COMBAT_SCENARIO_URL: ${{ needs.deploy.outputs.combat_scenario_url }}
          PROGRESSION_URL: ${{ needs.deploy.outputs.progression_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ "$JOB_RESULT" == "success" && -n "$HEALTH_URL" && -n "$COMBAT_MODELS_URL" && -n "$COMBAT_SCENARIO_URL" ]]; then
            BODY="### Cloudflare Worker deployment: successful ✅

          - Worker URL: $DEPLOYMENT_URL
          - Health endpoint: $HEALTH_URL
          - Combat model coverage: $COMBAT_MODELS_URL
          - Combat scenario endpoint: $COMBAT_SCENARIO_URL
          - Roster ascension dataset: $PROGRESSION_URL
          - API 0.9.0 contract: 14 verified actions, 4 conditional team effects and scenario schema v1
          - Shinku no-double-count, Hathor/Jiuyuan actions, Haniel Base ATK, Sakiri A4/DEF reduction and Hathor 12-second Remora CRIT window POST checks: success
          - Workflow evidence: $RUN_URL"
          else
            BODY="### Cloudflare Worker deployment: requires attention ❌

          - Deployment job result: $JOB_RESULT
          - Workflow diagnostics: $RUN_URL"
          fi
          gh issue comment 5 --repo "$GITHUB_REPOSITORY" --body "$BODY"
