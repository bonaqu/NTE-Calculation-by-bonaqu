name: Agent Chaos Nanally patch

on:
  push:
    branches:
      - feat/chaos-ultimate-actions
    paths:
      - tools/apply-chaos-nanally-patch.py
      - .github/workflows/agent-chaos-nanally-patch.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/chaos-ultimate-actions
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Apply guarded patch
        run: python tools/apply-chaos-nanally-patch.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Worker dry run
        run: npm run worker:check
      - name: Commit verified patch
        run: |
          rm tools/apply-chaos-nanally-patch.py
          rm .github/workflows/agent-chaos-nanally-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: complete Nanally and model Chaos burst actions"
          git push origin HEAD:feat/chaos-ultimate-actions
