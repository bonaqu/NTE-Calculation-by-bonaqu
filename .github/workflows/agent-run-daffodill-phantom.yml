name: Run guarded Daffodill Phantom Step patch

on:
  pull_request:
    branches:
      - bonaqu_projects
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch-feature-branch:
    if: github.head_ref == 'feat/daffodill-phantom-step'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/daffodill-phantom-step
          fetch-depth: 0
      - name: Check whether patch is pending
        id: guard
        shell: bash
        run: |
          if [[ -f tools/apply-daffodill-phantom-step.py && ! -f src/verified-visible-actions-batch-k.ts ]]; then
            echo "apply=true" >> "$GITHUB_OUTPUT"
          else
            echo "apply=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v6
        if: steps.guard.outputs.apply == 'true'
        with:
          node-version: 24
      - name: Apply guarded patch
        if: steps.guard.outputs.apply == 'true'
        run: |
          python tools/apply-daffodill-phantom-step.py
          python tools/fix-daffodill-phantom-tests.py
      - name: Install dependencies
        if: steps.guard.outputs.apply == 'true'
        run: npm install --no-audit --no-fund
      - name: Typecheck
        if: steps.guard.outputs.apply == 'true'
        run: npm run typecheck
      - name: Unit tests
        if: steps.guard.outputs.apply == 'true'
        run: npm test
      - name: Production build
        if: steps.guard.outputs.apply == 'true'
        run: npm run build
      - name: Worker dry run
        if: steps.guard.outputs.apply == 'true'
        run: npm run worker:check
      - name: Publish verified feature commit
        if: steps.guard.outputs.apply == 'true'
        run: |
          rm tools/apply-daffodill-phantom-step.py
          rm tools/fix-daffodill-phantom-tests.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add exact Daffodill Phantom Step bindings"
          git push origin HEAD:feat/daffodill-phantom-step
