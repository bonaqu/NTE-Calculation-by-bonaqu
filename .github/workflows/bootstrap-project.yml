name: Bootstrap project tree

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
    branches: [bonaqu_projects]
    paths:
      - '.bootstrap/**'

permissions:
  contents: write
  pull-requests: read

jobs:
  expand:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/production-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Expand reviewed project archive
        run: |
          cat .bootstrap/project.tar.gz.b64.part-* | base64 --decode > /tmp/project.tar.gz
          echo "cb8b88870a46a6548c27e80ea44ecfae21d7d551f5c07bd3dd9c4f16b7279c96  /tmp/project.tar.gz" | sha256sum --check
          tar -xzf /tmp/project.tar.gz
          rm -rf .bootstrap .github/workflows/bootstrap-project.yml
      - name: Commit project tree
        run: |
          git config user.name "bonaqu"
          git config user.email "48132049+bonaqu@users.noreply.github.com"
          git add --all
          git commit -m "feat: build production NTE calculation toolkit"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
