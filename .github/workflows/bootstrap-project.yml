name: Bootstrap project tree

on:
  push:
    branches: [feat/production-foundation]
    paths:
      - '.bootstrap/project.tar.gz.b64'

permissions:
  contents: write

jobs:
  expand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Expand reviewed project archive
        run: |
          base64 --decode .bootstrap/project.tar.gz.b64 > /tmp/project.tar.gz
          echo "c7a7409d670528f21e7d52ee7256f5c283253a0938b8e34f54999e1d8e60a04a  /tmp/project.tar.gz" | sha256sum --check
          tar -xzf /tmp/project.tar.gz
          rm -rf .bootstrap .github/workflows/bootstrap-project.yml
      - name: Commit project tree
        run: |
          git config user.name "bonaqu"
          git config user.email "48132049+bonaqu@users.noreply.github.com"
          git add --all
          git commit -m "feat: build production NTE calculation toolkit"
          git push
